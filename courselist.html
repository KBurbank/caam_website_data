<!DOCTYPE html>
<html>
<head>
    <title>UChicago CAAM Elective Courses</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .course-lists {
            display: flex;
            gap: 40px;
        }

        .course-section {
            flex: 1;
        }

        .course-card {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
        }

        .approved {
            border-left: 5px solid #4CAF50;
        }

        .not-approved {
            border-left: 5px solid #f44336;
        }

        h1 {
            color: #800000; /* UChicago maroon */
            text-align: center;
        }

        h2 {
            color: #666;
            border-bottom: 2px solid #800000;
            padding-bottom: 5px;
        }

        .course-number {
            font-weight: bold;
            color: #333;
        }

        .course-name {
            color: #666;
            font-size: 0.95em;
        }

        #loading {
            text-align: center;
            font-size: 1.2em;
            color: #666;
        }

        .search-box {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        /* Add new style for the inquiry text */
        .inquiry-text {
            text-align: center;
            color: #666;
            margin: 20px 0;
            font-size: 1.1em;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>CAAM Elective Courses</h1>
    
    <div class="inquiry-text">
        To inquire about the suitability of a course which is not listed here, please contact the CAAM DUS.
    </div>

    <input type="text" id="searchBox" class="search-box" 
           placeholder="Search for courses by number or name...">

    <div id="loading">Loading courses...</div>
    
    <div class="course-lists">
        <div class="course-section">
            <h2>Suitable as CAAM Electives</h2>
            <div id="approved-courses"></div>
        </div>
        
        <div class="course-section">
            <h2>Not Suitable</h2>
            <div id="not-approved-courses"></div>
        </div>
    </div>

    <script src="courselist.js"></script>
</body>
</html>
